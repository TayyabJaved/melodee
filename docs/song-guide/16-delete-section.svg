idth="54" height="34" rx="6" fill="#221E2C"/><text x="126" y="46" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="600">C</text><text x="125" y="60" font-size="10" fill="#9A93A8" text-anchor="start" font-weight="400">3:0</text><rect x="121" y="70" width="54" height="28" rx="5" fill="#FF7A5C"/><text x="128" y="88.5" font-size="12" fill="#17141F" text-anchor="start" font-weight="600">2</text><rect x="121" y="102" width="54" height="28" rx="5" fill="#FFC145"/><text x="128" y="120.5" font-size="12" fill="#17141F" text-anchor="start" font-weight="600">3</text><rect x="121" y="134" width="54" height="28" rx="5" fill="#46D9B0"/><text x="128" y="152.5" font-size="12" fill="#17141F" text-anchor="start" font-weight="600">2</text><rect x="121" y="166" width="54" height="28" rx="5" fill="#9D8CFF"/><text x="128" y="184.5" font-size="12" fill="#17141F" text-anchor="start" font-weight="600">1</text><rect x="177" y="31" width="54" height="34" rx="6" fill="none" stroke="#2E2939" stroke-width="1.2" stroke-dasharray="3 2"/><text x="204" y="54" font-size="18" fill="#5A5468" text-anchor="middle" font-weight="500">+</text><rect x="64" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="120" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="176" y="68" width="1" height="128" rx="0" fill="#2E2939"/><text x="8" y="216" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="500">A · 2 bars AUTO</text><text x="232" y="216" font-size="10" fill="#9A93A8" text-anchor="end" font-weight="400">used 2x</text><rect x="8" y="228" width="224" height="6" rx="3" fill="#221E2C"/><rect x="0" y="0" width="240" height="240" rx="0" fill="#17141F" opacity="0.72"/><rect x="14" y="70" width="212" height="100" rx="12" fill="#221E2C" stroke="#2E2939" stroke-width="1"/><text x="120" y="102" font-size="13" fill="#F3EEF8" text-anchor="middle" font-weight="700">DELETE SECTION A?</text><text x="120" y="124" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">This column only</text><text x="120" y="154" font-size="11" fill="#C9C2D6" text-anchor="middle" font-weight="500">OCT− no    OCT+ yes</text></g><rect width="240" height="240" rx="6" fill="none" stroke="#3A3446"/></g>
<rect x="47" y="195" width="322" height="154" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="47" cy="195" r="11" fill="#7FE0FF"/><text x="47" y="199.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Pick the column, hold <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>, choose Delete</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">section.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">OCT+</tspan> yes, <tspan fill="#FFD27A" font-weight="700">OCT−</tspan> no.</text>
<text x="432" y="223" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="247" font-size="13" fill="#C9C2D6" xml:space="preserve">The column goes and the rest close up. "This column only":</text><text x="432" y="269" font-size="13" fill="#C9C2D6" xml:space="preserve">A still plays in its other column.</text>
<rect x="432" y="297" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="297" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="321" font-size="12.5" fill="#C9C2D6" xml:space="preserve">"Its last column" means the section goes with it. Hold <tspan fill="#FFD27A" font-weight="700">EDIT</tspan></text><text x="446" y="342.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">to undo.</text>
</svg>

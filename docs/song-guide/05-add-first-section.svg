<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 488" width="940" height="488" font-family="Rubik, Inter, 'Helvetica Neue', Arial, sans-serif">
<rect x="0" y="0" width="940" height="488" rx="0" fill="#0E0C13"/>
<defs><clipPath id="scr"><rect width="240" height="240" rx="6"/></clipPath></defs>
<text x="28" y="36" font-size="12" fill="#7FE0FF" text-anchor="start" font-weight="700">STEP 5 OF 20  ·  SONG</text>
<text x="28" y="68" font-size="26" fill="#F3EEF8" text-anchor="start" font-weight="700">Add your first section (A)</text>
<g transform="translate(28 92) scale(1.5)"><g clip-path="url(#scr)"><rect x="0" y="0" width="240" height="240" rx="0" fill="#17141F"/><text x="8" y="19" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="500">ADDED A</text><text x="232" y="19" font-size="12" fill="#F5A623" text-anchor="end" font-weight="600">SONG</text><rect x="9" y="31" width="54" height="34" rx="6" fill="#221E2C"/><text x="14" y="46" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="600">A</text><text x="13" y="60" font-size="10" fill="#9A93A8" text-anchor="start" font-weight="400">2:0</text><rect x="9" y="70" width="54" height="28" rx="5" fill="#FF7A5C"/><text x="16" y="88.5" font-size="12" fill="#17141F" text-anchor="start" font-weight="600">1</text><rect x="9" y="102" width="54" height="28" rx="5" fill="#FFC145"/><text x="16" y="120.5" font-size="12" fill="#17141F" text-anchor="start" font-weight="600">1</text><text x="16" y="152.5" font-size="10" fill="#5A5468" text-anchor="start" font-weight="500">REST</text><text x="16" y="184.5" font-size="10" fill="#5A5468" text-anchor="start" font-weight="500">REST</text><rect x="65" y="31" width="54" height="34" rx="6" fill="none" stroke="#F5A623" stroke-width="1.2" stroke-dasharray="3 2"/><text x="92" y="54" font-size="18" fill="#F5A623" text-anchor="middle" font-weight="500">+</text><rect x="64" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="120" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="176" y="68" width="1" height="128" rx="0" fill="#2E2939"/><text x="8" y="216" font-size="10" fill="#9A93A8" text-anchor="start" font-weight="500">OCT+ adds what plays now</text><rect x="8" y="228" width="224" height="6" rx="3" fill="#221E2C"/></g><rect width="240" height="240" rx="6" fill="none" stroke="#3A3446"/></g>
<rect x="123.5" y="136.5" width="85" height="55" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="123.5" cy="136.5" r="11" fill="#7FE0FF"/><text x="123.5" y="141" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<rect x="39.5" y="136.5" width="85" height="251.5" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="39.5" cy="136.5" r="11" fill="#7FE0FF"/><text x="39.5" y="141" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Set each track's pattern for the first part</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">(step 2): drums 1, bass 1. On SONG, turn <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan></text><text x="462" y="180" font-size="14" fill="#F3EEF8" xml:space="preserve">to the + card.</text>
<circle cx="442" cy="204" r="11" fill="#7FE0FF"/><text x="442" y="208.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">Tap <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>: section A, a column of what every</text><text x="462" y="232" font-size="14" fill="#F3EEF8" xml:space="preserve">track plays.</text>
<text x="432" y="269" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="293" font-size="13" fill="#C9C2D6" xml:space="preserve">Card A with its length in bars:beats (2:0, two bars: AUTO,</text><text x="432" y="315" font-size="13" fill="#C9C2D6" xml:space="preserve">its longest pattern), its column showing each track's</text><text x="432" y="337" font-size="13" fill="#C9C2D6" xml:space="preserve">pattern number; REST is a resting track. The cursor stays</text><text x="432" y="359" font-size="13" fill="#C9C2D6" xml:space="preserve">on + for the next one.</text>
<rect x="432" y="387" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="387" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="411" font-size="12.5" fill="#C9C2D6" xml:space="preserve">A track can rest in a section: set it on the section page</text><text x="446" y="432.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">(step 10), turning below pattern 1.</text>
</svg>

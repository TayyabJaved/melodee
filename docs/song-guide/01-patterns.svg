<rect x="26" y="135" width="46" height="262" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="26" cy="135" r="11" fill="#7FE0FF"/><text x="26" y="139.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<rect x="71" y="202.5" width="313" height="64" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="71" cy="202.5" r="11" fill="#7FE0FF"/><text x="71" y="207" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<rect x="71" y="138" width="38.5" height="32.5" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="71" cy="138" r="11" fill="#7FE0FF"/><text x="71" y="142.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Hold <tspan fill="#FFD27A" font-weight="700">SEQ</tspan> for a moment (or press <tspan fill="#FFD27A" font-weight="700">SEQ</tspan> and turn</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">SELECT</tspan> to PATTERNS).</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Each row is a track: 1 drums, 2 bass, 3 chords,</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">4 lead, in its colour. Its cells are its</text><text x="462" y="232" font-size="14" fill="#F3EEF8" xml:space="preserve">patterns, each with its number: 1-8 above, 9-16</text><text x="462" y="255" font-size="14" fill="#F3EEF8" xml:space="preserve">below.</text>
<circle cx="442" cy="279" r="11" fill="#7FE0FF"/><text x="442" y="283.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="462" y="284" font-size="14" fill="#F3EEF8" xml:space="preserve">The filled cell is the pattern the track plays</text><text x="462" y="307" font-size="14" fill="#F3EEF8" xml:space="preserve">now; the line under its number shows how far it</text><text x="462" y="330" font-size="14" fill="#F3EEF8" xml:space="preserve">has played.</text>
<text x="432" y="367" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="391" font-size="13" fill="#C9C2D6" xml:space="preserve">Cells with notes are raised, their number in the track's</text><text x="432" y="413" font-size="13" fill="#C9C2D6" xml:space="preserve">colour; empty ones are outlines. At the foot: the song's</text><text x="432" y="435" font-size="13" fill="#C9C2D6" xml:space="preserve">sections, by letter.</text>
<rect x="432" y="463" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="463" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="487" font-size="12.5" fill="#C9C2D6" xml:space="preserve">A pattern is one track's loop. Write its notes on SEQ &gt;</text><text x="446" y="508.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">NOTES; this page chooses which one plays.</text>
</svg>

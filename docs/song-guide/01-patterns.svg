<rect x="71" y="165" width="20.5" height="58" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="71" cy="165" r="11" fill="#7FE0FF"/><text x="71" y="169.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Hold <tspan fill="#FFD27A" font-weight="700">SEQ</tspan> for a moment (or press <tspan fill="#FFD27A" font-weight="700">SEQ</tspan> and turn</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">SELECT</tspan> to PATTERNS).</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Each row is a track: 1 drums, 2 bass, 3 chords,</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">4 lead. The numbers on top are its patterns, 1</text><text x="462" y="232" font-size="14" fill="#F3EEF8" xml:space="preserve">to 16.</text>
<circle cx="442" cy="256" r="11" fill="#7FE0FF"/><text x="442" y="260.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="462" y="261" font-size="14" fill="#F3EEF8" xml:space="preserve">The filled cell is the pattern each track plays</text><text x="462" y="284" font-size="14" fill="#F3EEF8" xml:space="preserve">now.</text>
<text x="432" y="321" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="345" font-size="13" fill="#C9C2D6" xml:space="preserve">A grid, a row a track. Cells with notes are raised; empty</text><text x="432" y="367" font-size="13" fill="#C9C2D6" xml:space="preserve">ones are outlines. At the foot: the song's sections.</text>
<rect x="432" y="395" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="395" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="395" font-size="1" fill="#F3EEF8" text-anchor="start" font-weight="400"></text>
<text x="446" y="419" font-size="12.5" fill="#C9C2D6" xml:space="preserve">A pattern is one track's loop. Write its notes on SEQ &gt;</text><text x="446" y="440.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">NOTES; this page chooses which one plays.</text>
</svg>

<rect x="32" y="297" width="352" height="106" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="32" cy="297" r="11" fill="#7FE0FF"/><text x="32" y="301.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Select the track (<tspan fill="#FFD27A" font-weight="700">ALGORITHM</tspan> or a black key with</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">SEQ</tspan> held) and its pattern.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Tap <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>: the pattern's sheet.</text>
<circle cx="442" cy="210" r="11" fill="#7FE0FF"/><text x="442" y="214.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="462" y="215" font-size="14" fill="#F3EEF8" xml:space="preserve">Copy to…: turn any knob to the place, <tspan fill="#FFD27A" font-weight="700">OCT+</tspan></text><text x="462" y="238" font-size="14" fill="#F3EEF8" xml:space="preserve">copies. Delete pattern asks first.</text>
<text x="432" y="275" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="299" font-size="13" fill="#C9C2D6" xml:space="preserve">The sheet over the grid. <tspan fill="#FFD27A" font-weight="700">OCT−</tspan> closes it; hold <tspan fill="#FFD27A" font-weight="700">EDIT</tspan> to undo.</text>
<rect x="432" y="327" width="484" height="90.5" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="327" width="4" height="90.5" rx="2" fill="#F5A623"/>
<text x="446" y="351" font-size="12.5" fill="#C9C2D6" xml:space="preserve">Copies are separate patterns. A song only points at</text><text x="446" y="372.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">patterns: editing pattern 2's notes changes every section</text><text x="446" y="394" font-size="12.5" fill="#C9C2D6" xml:space="preserve">using it.</text>
</svg>

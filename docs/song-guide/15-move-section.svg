<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Pick the column, hold <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>, choose Move</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">section.</text>

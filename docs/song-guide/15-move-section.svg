<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Turn <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan> to where it goes and tap <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>; <tspan fill="#FFD27A" font-weight="700">OCT−</tspan></text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">cancels.</text>
<text x="432" y="246" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="270" font-size="13" fill="#C9C2D6" xml:space="preserve">MOVE TO... in the header while you choose. It goes in</text><text x="432" y="292" font-size="13" fill="#C9C2D6" xml:space="preserve">before the column you pick (the + card: the end).</text>
<rect x="432" y="320" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="320" width="4" height="69" rx="2" fill="#F5A623"/>

<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">On SONG pick the column, then hold <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>: the</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">song's sheet.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">KNOB 2</tspan> to Copy as new section, <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>.</text>
<text x="432" y="223" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="247" font-size="13" fill="#C9C2D6" xml:space="preserve">A new letter (D) after it, with B's patterns, sounds and</text><text x="432" y="269" font-size="13" fill="#C9C2D6" xml:space="preserve">length. Change D on its page; B stays as it was.</text>
<rect x="432" y="297" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="297" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="321" font-size="12.5" fill="#C9C2D6" xml:space="preserve">Duplicate section places the same B again instead: change</text><text x="446" y="342.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">one, both change.</text>

<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Pick a column and tap <tspan fill="#FFD27A" font-weight="700">REC</tspan>: its section for</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">every track at once (stopped: it starts</text><text x="462" y="180" font-size="14" fill="#F3EEF8" xml:space="preserve">playing).</text>
<circle cx="442" cy="204" r="11" fill="#7FE0FF"/><text x="442" y="208.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">While patterns play, tap <tspan fill="#FFD27A" font-weight="700">REC</tspan> on another: it</text><text x="462" y="232" font-size="14" fill="#F3EEF8" xml:space="preserve">waits for the end of the one playing.</text>
<text x="432" y="269" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="293" font-size="13" fill="#C9C2D6" xml:space="preserve">B NEXT in the header, B's card dashed until it starts. The</text><text x="432" y="315" font-size="13" fill="#C9C2D6" xml:space="preserve">first launch waits for the next bar.</text>
<rect x="432" y="343" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="343" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="367" font-size="12.5" fill="#C9C2D6" xml:space="preserve">Change a track by hand afterwards and the header says A</text><text x="446" y="388.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">CHANGED: add it as a section on + to keep it.</text>

<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Turn <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan> to pick track 1's pattern, <tspan fill="#FFD27A" font-weight="700">KNOB 2</tspan></text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">track 2's, <tspan fill="#FFD27A" font-weight="700">KNOB 3</tspan> and <tspan fill="#FFD27A" font-weight="700">KNOB 4</tspan> tracks 3 and 4.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Or: hold <tspan fill="#FFD27A" font-weight="700">SEQ</tspan> and press a white key (patterns</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">1-16) for the selected track; black keys pick</text><text x="462" y="232" font-size="14" fill="#F3EEF8" xml:space="preserve">the track.</text>
<text x="432" y="269" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="293" font-size="13" fill="#C9C2D6" xml:space="preserve">Stopped, the pattern changes at once. Playing, it waits for</text><text x="432" y="315" font-size="13" fill="#C9C2D6" xml:space="preserve">that track's loop to end: the waiting one is dashed.</text>
<rect x="432" y="343" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="343" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="343" font-size="1" fill="#F3EEF8" text-anchor="start" font-weight="400"></text>
<text x="446" y="367" font-size="12.5" fill="#C9C2D6" xml:space="preserve">Each track changes on its own. To switch every track</text><text x="446" y="388.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">together, use a section (steps 5 and 19).</text>
</svg>

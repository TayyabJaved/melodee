1" width="54" height="34" rx="6" fill="#221E2C"/><text x="126" y="46" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="600">A</text><text x="125" y="60" font-size="9" fill="#9A93A8" text-anchor="start" font-weight="400">2 bars</text><rect x="121" y="70" width="54" height="28" rx="5" fill="#FF7A5C"/><text x="127" y="88.5" font-size="11" fill="#17141F" text-anchor="start" font-weight="500">P1</text><rect x="121" y="102" width="54" height="28" rx="5" fill="#FFC145"/><text x="127" y="120.5" font-size="11" fill="#17141F" text-anchor="start" font-weight="500">P1</text><text x="127" y="152.5" font-size="11" fill="#5A5468" text-anchor="start" font-weight="400">--</text><text x="127" y="184.5" font-size="11" fill="#5A5468" text-anchor="start" font-weight="400">--</text><rect x="177" y="31" width="54" height="34" rx="6" fill="#221E2C"/><text x="182" y="46" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="600">C</text><text x="181" y="60" font-size="9" fill="#9A93A8" text-anchor="start" font-weight="400">3 bars</text><rect x="177" y="70" width="54" height="28" rx="5" fill="#FF7A5C"/><text x="183" y="88.5" font-size="11" fill="#17141F" text-anchor="start" font-weight="500">P2</text><rect x="177" y="102" width="54" height="28" rx="5" fill="#FFC145"/><text x="183" y="120.5" font-size="11" fill="#17141F" text-anchor="start" font-weight="500">P3</text><rect x="177" y="134" width="54" height="28" rx="5" fill="#46D9B0"/><text x="183" y="152.5" font-size="11" fill="#17141F" text-anchor="start" font-weight="500">P2</text><rect x="177" y="166" width="54" height="28" rx="5" fill="#9D8CFF"/><text x="183" y="184.5" font-size="11" fill="#17141F" text-anchor="start" font-weight="500">P1</text><rect x="64" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="120" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="176" y="68" width="1" height="128" rx="0" fill="#2E2939"/><rect x="93" y="30" width="2" height="166" rx="0" fill="#F3EEF8"/><text x="8" y="216" font-size="12" fill="#F3EEF8" text-anchor="start" font-weight="500">B · 4 bars AUTO</text><text x="232" y="216" font-size="10" fill="#9A93A8" text-anchor="end" font-weight="400">used 1x</text><rect x="8" y="228" width="224" height="6" rx="3" fill="#221E2C"/><rect x="8" y="228" width="80" height="6" rx="3" fill="#F3EEF8"/></g><rect width="240" height="240" rx="6" fill="none" stroke="#3A3446"/></g>
<rect x="123.5" y="136.5" width="85" height="55" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="123.5" cy="136.5" r="11" fill="#7FE0FF"/><text x="123.5" y="141" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<rect x="38" y="429" width="340" height="19" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="38" cy="429" r="11" fill="#7FE0FF"/><text x="38" y="433.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Turn <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan> to where to start and press <tspan fill="#FFD27A" font-weight="700">PLAY</tspan>;</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">PLAY</tspan> again stops.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">The column playing is coloured; a playhead and</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">the progress bar move.</text>
<text x="432" y="246" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="270" font-size="13" fill="#C9C2D6" xml:space="preserve">Each section plays its length, then every track starts the</text><text x="432" y="292" font-size="13" fill="#C9C2D6" xml:space="preserve">next column together. The last column stops the song,</text><text x="432" y="314" font-size="13" fill="#C9C2D6" xml:space="preserve">unless Loop song (hold <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>) is on.</text>
<rect x="432" y="342" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="342" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="342" font-size="1" fill="#F3EEF8" text-anchor="start" font-weight="400"></text>
<text x="446" y="366" font-size="12.5" fill="#C9C2D6" xml:space="preserve"><tspan fill="#FFD27A" font-weight="700">PLAY</tspan> on the + card starts at the first column. STOP gives</text><text x="446" y="387.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">each track back the pattern it had before.</text>
</svg>

A93A8" text-anchor="end" font-weight="400">in song 1x</text><rect x="0" y="0" width="240" height="240" rx="0" fill="#17141F" opacity="0.72"/><rect x="4" y="32" width="232" height="204" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/><text x="14" y="55" font-size="14" fill="#F3EEF8" text-anchor="start" font-weight="600">Section B</text><text x="226" y="55" font-size="10" fill="#9A93A8" text-anchor="end" font-weight="400">in song 1x</text><rect x="4" y="66" width="232" height="34" rx="0" fill="#3A2E22"/><rect x="4" y="66" width="4" height="34" rx="0" fill="#F5A623"/><text x="14" y="88" font-size="14" fill="#F3EEF8" text-anchor="start" font-weight="500">Length</text><text x="226" y="88" font-size="12" fill="#F5A623" text-anchor="end" font-weight="400">4 bars AUTO</text><text x="14" y="122" font-size="14" fill="#C9C2D6" text-anchor="start" font-weight="400">Set preset</text><text x="226" y="122" font-size="12" fill="#9A93A8" text-anchor="end" font-weight="400">T2</text><text x="14" y="156" font-size="14" fill="#C9C2D6" text-anchor="start" font-weight="400">Remove preset</text><text x="226" y="156" font-size="12" fill="#9A93A8" text-anchor="end" font-weight="400">T2</text><text x="14" y="190" font-size="14" fill="#C9C2D6" text-anchor="start" font-weight="400">Punch FX</text><text x="14" y="224" font-size="14" fill="#C9C2D6" text-anchor="start" font-weight="400">Copy as new section</text></g><rect width="240" height="240" rx="6" fill="none" stroke="#3A3446"/></g>
<rect x="32" y="138" width="352" height="313" rx="7" fill="none" stroke="#7FE0FF" stroke-width="2.2"/><circle cx="32" cy="138" r="11" fill="#7FE0FF"/><text x="32" y="142.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="432" y="106" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">DO THIS</text>
<circle cx="442" cy="129" r="11" fill="#7FE0FF"/><text x="442" y="133.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">1</text>
<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">On the section page tap <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>: its sheet. <tspan fill="#FFD27A" font-weight="700">KNOB 2</tspan></text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">picks a row, <tspan fill="#FFD27A" font-weight="700">OCT+</tspan> does it.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Set preset: a sound for the selected track in</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">this section (<tspan fill="#FFD27A" font-weight="700">ALGORITHM</tspan> picks the track).</text>
<circle cx="442" cy="233" r="11" fill="#7FE0FF"/><text x="442" y="237.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="462" y="238" font-size="14" fill="#F3EEF8" xml:space="preserve">Punch FX (or <tspan fill="#FFD27A" font-weight="700">FX</tspan>): master effects at steps of</text><text x="462" y="261" font-size="14" fill="#F3EEF8" xml:space="preserve">the section.</text>
<text x="432" y="298" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="322" font-size="13" fill="#C9C2D6" xml:space="preserve">On the Length row <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan> turns the length and <tspan fill="#FFD27A" font-weight="700">OCT+</tspan> sets</text><text x="432" y="344" font-size="13" fill="#C9C2D6" xml:space="preserve">AUTO. A section's sound plays in that section only; the</text><text x="432" y="366" font-size="13" fill="#C9C2D6" xml:space="preserve">normal one returns elsewhere and on STOP.</text>
<rect x="432" y="394" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="394" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="394" font-size="1" fill="#F3EEF8" text-anchor="start" font-weight="400"></text>
<text x="446" y="418" font-size="12.5" fill="#C9C2D6" xml:space="preserve">Copy as new section makes the next letter with the same</text><text x="446" y="439.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">contents, then shows it, for a variation.</text>
</svg>

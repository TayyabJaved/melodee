<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Let go, tap <tspan fill="#FFD27A" font-weight="700">OCT+</tspan>: Copy, Move, Duplicate or</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">Delete sections, or Clear selection.</text>
<text x="432" y="246" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>

<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Hold <tspan fill="#FFD27A" font-weight="700">OCT+</tspan> and turn <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan>: the columns from the</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">cursor on are selected.</text>

<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Turn <tspan fill="#FFD27A" font-weight="700">SELECT</tspan>: one beat a click, from its AUTO</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">length. Turn it below one beat for AUTO again.</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">A pattern longer than the section is cut where</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">it ends: the red mark.</text>
<text x="432" y="246" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="270" font-size="13" fill="#C9C2D6" xml:space="preserve">The AUTO chip goes when you set a length. Shorter patterns</text><text x="432" y="292" font-size="13" fill="#C9C2D6" xml:space="preserve">loop to fill the section.</text>
<rect x="432" y="320" width="484" height="69" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="320" width="4" height="69" rx="2" fill="#F5A623"/>
<text x="446" y="320" font-size="1" fill="#F3EEF8" text-anchor="start" font-weight="400"></text>
<text x="446" y="344" font-size="12.5" fill="#C9C2D6" xml:space="preserve">There are no repeats: make a section longer, or place it</text><text x="446" y="365.5" font-size="12.5" fill="#C9C2D6" xml:space="preserve">twice. Every track starts again at each column.</text>

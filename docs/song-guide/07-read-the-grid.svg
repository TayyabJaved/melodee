<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Cards: a column each, its section's letter and</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">length in bars:beats (2:3 = 2 bars 3 beats, 4:0</text><text x="462" y="180" font-size="14" fill="#F3EEF8" xml:space="preserve">= 4 bars).</text>
<circle cx="442" cy="204" r="11" fill="#7FE0FF"/><text x="442" y="208.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">Rows: a track each, the number of the pattern</text><text x="462" y="232" font-size="14" fill="#F3EEF8" xml:space="preserve">it plays in each column; REST rests.</text>
<circle cx="442" cy="256" r="11" fill="#7FE0FF"/><text x="442" y="260.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="462" y="261" font-size="14" fill="#F3EEF8" xml:space="preserve">Footer: the picked column's section and length,</text><text x="462" y="284" font-size="14" fill="#F3EEF8" xml:space="preserve">AUTO when it follows its longest pattern.</text>
<circle cx="442" cy="308" r="11" fill="#7FE0FF"/><text x="442" y="312.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">4</text>
<text x="462" y="313" font-size="14" fill="#F3EEF8" xml:space="preserve">How often the song uses that section.</text>
<text x="432" y="350" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="374" font-size="13" fill="#C9C2D6" xml:space="preserve">The picked column has a white card. The header shows the</text><text x="432" y="396" font-size="13" fill="#C9C2D6" xml:space="preserve">song's length in minutes and seconds.</text>
<rect x="432" y="424" width="484" height="47.5" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="424" width="4" height="47.5" rx="2" fill="#F5A623"/>
<text x="446" y="448" font-size="12.5" fill="#C9C2D6" xml:space="preserve">Four columns show at a time; <tspan fill="#FFD27A" font-weight="700">KNOB 1</tspan> scrolls.</text>

<text x="462" y="134" font-size="14" fill="#F3EEF8" xml:space="preserve">Cards: a column each, its section's letter and</text><text x="462" y="157" font-size="14" fill="#F3EEF8" xml:space="preserve">length (3:2 = 3 bars 2 beats).</text>
<circle cx="442" cy="181" r="11" fill="#7FE0FF"/><text x="442" y="185.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">2</text>
<text x="462" y="186" font-size="14" fill="#F3EEF8" xml:space="preserve">Rows: a track each, its pattern in each column;</text><text x="462" y="209" font-size="14" fill="#F3EEF8" xml:space="preserve">-- rests.</text>
<circle cx="442" cy="233" r="11" fill="#7FE0FF"/><text x="442" y="237.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">3</text>
<text x="462" y="238" font-size="14" fill="#F3EEF8" xml:space="preserve">Footer: the picked column's section and length,</text><text x="462" y="261" font-size="14" fill="#F3EEF8" xml:space="preserve">AUTO when it follows its longest pattern.</text>
<circle cx="442" cy="285" r="11" fill="#7FE0FF"/><text x="442" y="289.5" font-size="12" fill="#17141F" text-anchor="middle" font-weight="700">4</text>
<text x="462" y="290" font-size="14" fill="#F3EEF8" xml:space="preserve">How often the song uses that section.</text>
<text x="432" y="327" font-size="12" fill="#9A93A8" text-anchor="start" font-weight="700">YOU SEE</text>
<text x="432" y="351" font-size="13" fill="#C9C2D6" xml:space="preserve">The picked column has a white card. The header shows the</text><text x="432" y="373" font-size="13" fill="#C9C2D6" xml:space="preserve">song's length in minutes and seconds.</text>
<rect x="432" y="401" width="484" height="47.5" rx="8" fill="#1C1826" stroke="#2E2939" stroke-width="1"/><rect x="432" y="401" width="4" height="47.5" rx="2" fill="#F5A623"/>

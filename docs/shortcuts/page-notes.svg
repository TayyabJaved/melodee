<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" font-family="Rubik, Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="NOTES">
<rect x="0" y="0" width="860" height="480" rx="0" fill="#17141F"/>
<text x="28" y="40" font-size="22" fill="#F3EEF8" text-anchor="start" font-weight="600">SEQ › NOTES</text>
<text x="28" y="64" font-size="13" fill="#9A93A8" text-anchor="start" font-weight="400">Steps and recorded takes on a piano roll. Keys and MIDI enter notes or chords while stopped.</text>
<rect x="28" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="124" cy="122" r="20" fill="#262033" stroke="#FF7A5C" stroke-width="3"/>
<line x1="124" y1="122" x2="134" y2="106" stroke="#FF7A5C" stroke-width="3" stroke-linecap="round"/>
<text x="124" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 1</text>
<text x="124" y="180" font-size="14" fill="#FF7A5C" text-anchor="middle" font-weight="600">STEP</text>
<text x="124" y="198" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">walk every step and each</text>
<text x="124" y="214" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">pitch of a chord</text>
<rect x="232" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="328" cy="122" r="20" fill="#262033" stroke="#FF9A82" stroke-width="3"/>
<line x1="328" y1="122" x2="338" y2="106" stroke="#FF9A82" stroke-width="3" stroke-linecap="round"/>
<text x="328" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 2</text>
<text x="328" y="180" font-size="14" fill="#FF9A82" text-anchor="middle" font-weight="600">PITCH</text>
<text x="328" y="198" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">on an empty step: insert</text>
<rect x="436" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="532" cy="122" r="20" fill="#262033" stroke="#FFB8A6" stroke-width="3"/>
<line x1="532" y1="122" x2="542" y2="106" stroke="#FFB8A6" stroke-width="3" stroke-linecap="round"/>
<text x="532" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 3</text>
<text x="532" y="180" font-size="14" fill="#FFB8A6" text-anchor="middle" font-weight="600">LENGTH</text>
<text x="532" y="198" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">quarter steps (hold ENV:</text>
<text x="532" y="214" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">fine)</text>
<rect x="640" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="736" cy="122" r="20" fill="#262033" stroke="#FFD5CA" stroke-width="3"/>
<line x1="736" y1="122" x2="746" y2="106" stroke="#FFD5CA" stroke-width="3" stroke-linecap="round"/>
<text x="736" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 4</text>
<text x="736" y="180" font-size="14" fill="#FFD5CA" text-anchor="middle" font-weight="600">VEL</text>
<text x="736" y="198" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">1–127 (hold ENV: slide)</text>
<rect x="28" y="232" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="232" width="5" height="46" rx="2" fill="#7FE0FF"/>
<text x="44" y="252" font-size="12" fill="#7FE0FF" text-anchor="start" font-weight="700">tap EDIT</text>
<text x="44" y="270" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">delete the highlighted pitch</text>
<rect x="436" y="232" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="232" width="5" height="46" rx="2" fill="#9D8CFF"/>
<text x="452" y="252" font-size="12" fill="#9D8CFF" text-anchor="start" font-weight="700">OCT+</text>
<text x="452" y="270" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">empty: a note; on a note: its sheet</text>
<rect x="28" y="286" width="396" height="62" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="286" width="5" height="62" rx="2" fill="#9D8CFF"/>
<text x="44" y="306" font-size="12" fill="#9D8CFF" text-anchor="start" font-weight="700">hold OCT+</text>
<text x="44" y="324" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">with SELECT / KNOB 1 / 2: a range; alone: Quantize,</text>
<text x="44" y="340" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">Clear pattern, Clear motion</text>
<rect x="436" y="286" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="286" width="5" height="46" rx="2" fill="#C9C2D6"/>
<text x="452" y="306" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="700">PRESETS</text>
<text x="452" y="324" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">zoom</text>
<rect x="436" y="340" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="340" width="5" height="46" rx="2" fill="#C9C2D6"/>
<text x="452" y="360" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="700">hold SCL + SELECT</text>
<text x="452" y="378" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">move the note</text>
<rect x="28" y="356" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="356" width="5" height="46" rx="2" fill="#C9C2D6"/>
<text x="44" y="376" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="700">hold ENV + SELECT</text>
<text x="44" y="394" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">longer / shorter</text>
<rect x="436" y="394" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="394" width="5" height="46" rx="2" fill="#7FE0FF"/>
<text x="452" y="414" font-size="12" fill="#7FE0FF" text-anchor="start" font-weight="700">hold EDIT</text>
<text x="452" y="432" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">undo (recording: erase)</text>
<rect x="28" y="410" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="410" width="5" height="46" rx="2" fill="#C9C2D6"/>
<text x="44" y="430" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="700">M3 + A#4</text>
<text x="44" y="448" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">hear the note or chord</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="426" viewBox="0 0 860 426" font-family="Rubik, Inter, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="SONG">
<rect x="0" y="0" width="860" height="426" rx="0" fill="#17141F"/>
<text x="28" y="40" font-size="22" fill="#F3EEF8" text-anchor="start" font-weight="600">SEQ › SONG</text>
<text x="28" y="64" font-size="13" fill="#9A93A8" text-anchor="start" font-weight="400">A column a section placed (its letter and bars:beats), played left to right; the + column adds one.</text>
<rect x="28" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="124" cy="122" r="20" fill="#262033" stroke="#FF7A5C" stroke-width="3"/>
<line x1="124" y1="122" x2="134" y2="106" stroke="#FF7A5C" stroke-width="3" stroke-linecap="round"/>
<text x="124" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 1</text>
<text x="124" y="180" font-size="14" fill="#FF7A5C" text-anchor="middle" font-weight="600">COLUMN</text>
<text x="124" y="198" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">pick one; past the last:</text>
<text x="124" y="214" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">+</text>
<rect x="232" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="328" cy="122" r="20" fill="#262033" stroke="#FF9A82" stroke-width="3"/>
<line x1="328" y1="122" x2="338" y2="106" stroke="#FF9A82" stroke-width="3" stroke-linecap="round"/>
<text x="328" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 2</text>
<text x="328" y="180" font-size="14" fill="#FF9A82" text-anchor="middle" font-weight="600">SECTION</text>
<text x="328" y="198" font-size="12" fill="#C9C2D6" text-anchor="middle" font-weight="400">which section it plays</text>
<rect x="436" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="532" cy="122" r="20" fill="#262033" stroke="#5A5468" stroke-width="3"/>
<line x1="532" y1="122" x2="542" y2="106" stroke="#5A5468" stroke-width="3" stroke-linecap="round"/>
<text x="532" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 3</text>
<text x="532" y="180" font-size="14" fill="#5A5468" text-anchor="middle" font-weight="600">—</text>
<rect x="640" y="88" width="192" height="128" rx="10" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<circle cx="736" cy="122" r="20" fill="#262033" stroke="#5A5468" stroke-width="3"/>
<line x1="736" y1="122" x2="746" y2="106" stroke="#5A5468" stroke-width="3" stroke-linecap="round"/>
<text x="736" y="162" font-size="11" fill="#9A93A8" text-anchor="middle" font-weight="400">KNOB 4</text>
<text x="736" y="180" font-size="14" fill="#5A5468" text-anchor="middle" font-weight="600">—</text>
<rect x="28" y="232" width="396" height="62" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="232" width="5" height="62" rx="2" fill="#9D8CFF"/>
<text x="44" y="252" font-size="12" fill="#9D8CFF" text-anchor="start" font-weight="700">tap OCT+</text>
<text x="44" y="270" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">a column: its section page; +: add a section of what</text>
<text x="44" y="286" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">plays now</text>
<rect x="436" y="232" width="396" height="62" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="232" width="5" height="62" rx="2" fill="#9D8CFF"/>
<text x="452" y="252" font-size="12" fill="#9D8CFF" text-anchor="start" font-weight="700">hold OCT+</text>
<text x="452" y="270" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">Duplicate, Copy as new, Move, Copy, Delete section,</text>
<text x="452" y="286" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">Loop song, Clear song</text>
<rect x="28" y="302" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="302" width="5" height="46" rx="2" fill="#46D9B0"/>
<text x="44" y="322" font-size="12" fill="#46D9B0" text-anchor="start" font-weight="700">PLAY</text>
<text x="44" y="340" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">play from the picked column</text>
<rect x="436" y="302" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="302" width="5" height="46" rx="2" fill="#FF5A6E"/>
<text x="452" y="322" font-size="12" fill="#FF5A6E" text-anchor="start" font-weight="700">REC</text>
<text x="452" y="340" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">launch the section live</text>
<rect x="28" y="356" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="28" y="356" width="5" height="46" rx="2" fill="#7FE0FF"/>
<text x="44" y="376" font-size="12" fill="#7FE0FF" text-anchor="start" font-weight="700">tap FX</text>
<text x="44" y="394" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">the section's punches</text>
<rect x="436" y="356" width="396" height="46" rx="8" fill="#221E2C" stroke="#2E2939" stroke-width="1"/>
<rect x="436" y="356" width="5" height="46" rx="2" fill="#7FE0FF"/>
<text x="452" y="376" font-size="12" fill="#7FE0FF" text-anchor="start" font-weight="700">hold EDIT</text>
<text x="452" y="394" font-size="12" fill="#C9C2D6" text-anchor="start" font-weight="400">undo a song edit</text>
</svg>
